name: Android CI & APK Build

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: بناء وتجميع ملفي APK (تطبيق النسخ وعارض النسخ)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-read-only: false

      - name: Ensure Gradle Wrapper Executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          else
            gradle wrapper --gradle-version 8.9
            chmod +x ./gradlew
          fi

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Prepare and Verify google-services.json
        env:
          GS_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          GS_RAW: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 - <<'PY'
          import base64, json, os, pathlib, re, sys
          raw = (os.environ.get("GS_B64") or os.environ.get("GS_RAW") or "").strip()
          existing_gs = next(
              (
                  p
                  for p in (
                      pathlib.Path("google-services.json"),
                      pathlib.Path("backup-app/google-services.json"),
                      pathlib.Path("viewer-app/google-services.json"),
                  )
                  if p.is_file()
              ),
              None,
          )

          if raw:
              if raw.startswith("{"):
                  content = raw.encode("utf-8")
              else:
                  cleaned = "".join(raw.split())
                  content = base64.b64decode(cleaned)
              parsed = json.loads(content.decode("utf-8-sig"))
              print("تم استرجاع google-services.json من أسرار GitHub بنجاح.")
          elif existing_gs is not None:
              content = existing_gs.read_bytes()
              parsed = json.loads(content.decode("utf-8-sig"))
              print(f"تم استخدام {existing_gs} الموجود في المشروع تلقائيًا.")
          else:
              applet_cfg_path = pathlib.Path("firebase-applet-config.json")
              if not applet_cfg_path.exists():
                  print("::error::لم يتم العثور على firebase-applet-config.json أو google-services.json.", file=sys.stderr)
                  sys.exit(1)
              cfg = json.loads(applet_cfg_path.read_text(encoding="utf-8"))
              project_id = cfg.get("projectId", "personal-backup-app")
              api_key = cfg.get("apiKey", "")
              project_number = str(cfg.get("messagingSenderId") or "123456789012")
              storage_bucket = cfg.get("storageBucket") or f"{project_id}.appspot.com"
              oauth_client_id = cfg.get("oAuthClientId") or ""
              app_id_raw = cfg.get("appId") or ""
              m = re.search(r":([0-9a-fA-F]{8,})$", app_id_raw)
              hex_tail = (m.group(1).lower() if m else "9a6d13baf4427440")

              def make_client(pkg: str, idx: int) -> dict:
                  oauth_list = (
                      [{"client_id": oauth_client_id, "client_type": 3}]
                      if oauth_client_id
                      else []
                  )
                  return {
                      "client_info": {
                          "mobilesdk_app_id": f"1:{project_number}:android:{hex_tail[:14]}{idx:02x}",
                          "android_client_info": {"package_name": pkg},
                      },
                      "oauth_client": oauth_list,
                      "api_key": [{"current_key": api_key}],
                      "services": {
                          "appinvite_service": {
                              "other_platform_oauth_client": oauth_list,
                          }
                      },
                  }

              parsed = {
                  "project_info": {
                      "project_number": project_number,
                      "project_id": project_id,
                      "storage_bucket": storage_bucket,
                  },
                  "client": [
                      make_client("app.backup.source", 1),
                      make_client("app.backup.viewer", 2),
                  ],
                  "configuration_version": "1",
              }
              content = json.dumps(parsed, indent=2).encode("utf-8")
              print(f"تم توليد google-services.json تلقائيًا للحزمتين من firebase-applet-config.json للمشروع: {project_id}")

          for target in ("backup-app/google-services.json", "viewer-app/google-services.json"):
              pathlib.Path(target).parent.mkdir(parents=True, exist_ok=True)
              pathlib.Path(target).write_bytes(content)
          print("تم تأكيد ملفات google-services.json في كلا التطبيقين بنجاح.")
          PY

      - name: Run Unit Tests
        run: |
          ./gradlew :core:testDebugUnitTest :backup-app:testDebugUnitTest :viewer-app:testDebugUnitTest --no-daemon --continue

      - name: Build Debug APKs (:backup-app & :viewer-app)
        run: |
          ./gradlew :backup-app:assembleDebug :viewer-app:assembleDebug --no-daemon --stacktrace

      - name: Inspect Built APK Files
        run: |
          echo "=== ملفات APK الناتجة ==="
          ls -lh backup-app/build/outputs/apk/debug/*.apk
          ls -lh viewer-app/build/outputs/apk/debug/*.apk

      - name: Upload Backup App APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: backup-app-debug
          path: backup-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Viewer App APK (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: viewer-app-debug
          path: viewer-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Test Reports (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: "**/build/reports/tests/**"
          if-no-files-found: ignore
